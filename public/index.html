<!doctype html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#04070b">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070b;--cy:#4fd8ff;--cy2:#bff3ff;--go:#f0b84a;--tx:#dff3ff;--dim:#5f7e8d;--ln:#154457}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Exo 2",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 38% at 50% 27%,#0e3144 0,transparent 72%),linear-gradient(#154457 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,#154457 1px,transparent 1px) 0 0/34px 100%;opacity:.55;-webkit-mask:radial-gradient(80% 60% at 50% 28%,#000 20%,transparent 100%);mask:radial-gradient(80% 60% at 50% 28%,#000 20%,transparent 100%)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);transition:.4s}
body[data-s=think] .dot,body[data-s=boot] .dot{background:var(--go);box-shadow:0 0 10px var(--go)}
h1{font:900 16px Orbitron,sans-serif;letter-spacing:.32em;margin:0;color:var(--cy2);text-shadow:0 0 14px #4fd8ff99}
.tools{display:flex;gap:8px;align-items:center}
button,select{background:#08141c;color:var(--cy);border:1px solid var(--ln);padding:7px 11px;font:inherit;font-size:13px;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.sw{position:relative;width:38px;height:20px;display:block}
.sw input{appearance:none;-webkit-appearance:none;margin:0;width:100%;height:100%;border:1px solid var(--ln);background:#08141c;border-radius:10px;transition:.3s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:4px;left:4px;width:12px;height:12px;border-radius:50%;background:var(--dim);transition:.3s}
.sw input:checked{border-color:var(--cy)}.sw input:checked::after{left:22px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#core{width:min(72vw,300px);height:min(72vw,300px);align-self:center;margin-top:6px;flex:none}
#st{text-align:center;color:var(--go);font-size:13px;font-weight:500;letter-spacing:.14em;margin:0 0 8px;min-height:20px}
#log{flex:1;overflow-y:auto;padding:6px 16px 10px;display:flex;flex-direction:column;gap:10px;max-width:640px;width:100%;margin:0 auto;scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
.m{max-width:86%;padding:10px 14px;line-height:1.5;font-size:15px;white-space:pre-wrap;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.u{align-self:flex-end;border-right:2px solid var(--go);background:linear-gradient(270deg,#2b2210,#0b0e10)}
.a{align-self:flex-start;border-left:2px solid var(--cy);background:linear-gradient(90deg,#0f2f40,#07121a)}
form{display:flex;gap:10px;align-items:center;padding:8px 16px 14px;max-width:640px;width:100%;margin:0 auto}
input#in{flex:1;min-width:0;background:#07121a;border:1px solid var(--ln);color:var(--tx);padding:14px;font:inherit;font-size:16px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
#mic{position:relative;width:54px;height:54px;border-radius:50%;clip-path:none;font-size:20px;padding:0;border:1.5px solid var(--cy);box-shadow:0 0 14px #4fd8ff44;flex:none}
#mic.on{background:var(--cy);color:var(--bg)}
#mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--cy);animation:p 1.1s ease-out infinite}
@keyframes p{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
#send{color:var(--go);border-color:#5a4720;padding:14px 14px}
@media(prefers-reduced-motion:reduce){#mic.on::after{animation:none}}
</style></head><body data-s="boot">
<header><div class="brand"><span class="dot"></span><h1>J.A.R.V.I.S</h1></div>
<div class="tools"><label class="sw" title="Овоз"><input type="checkbox" id="vo" checked aria-label="Овоз"></label>
<select id="lang" aria-label="Забони овоз"><option value="ru-RU">RU</option><option value="en-US">EN</option></select>
<button id="bell" type="button" aria-label="Огоҳинома">🔔</button></div></header>
<canvas id="core" width="520" height="520"></canvas>
<div id="st"></div>
<div id="log" aria-live="polite"></div>
<form id="f"><button id="mic" type="button" aria-label="Микрофон">🎤</button><input id="in" placeholder="Фармон деҳ, Ҷаноб…" autocomplete="off"><button id="send">Фиристодан</button></form>
<script>
const API_BASE=""; // агар сайт дар GitHub Pages бошад: "https://НОМИ-СЕРВЕР.onrender.com"
const $=id=>document.getElementById(id);
let state="boot",hist=[];
try{hist=JSON.parse(localStorage.getItem("jv")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("jv",JSON.stringify(hist.slice(-20)))}catch(e){}};
function add(r,t,fx){
  const d=document.createElement("div");d.className="m "+r;$("log").appendChild(d);
  if(!fx)d.textContent=t;else{let i=0;const id=setInterval(()=>{i+=2;d.textContent=t.slice(0,i);$("log").scrollTop=1e9;if(i>=t.length)clearInterval(id)},16)}
  $("log").scrollTop=1e9;
}
function setState(s){state=s;document.body.dataset.s=s;$("st").textContent={boot:"НИЗОМҲО ОҒОЗ МЕШАВАНД…",idle:"ОМОДААМ",listen:"ГӮШ МЕКУНАМ…",think:"ФИКР МЕКУНАМ…",speak:"ҶАВОБ МЕДИҲАМ…"}[s]}
setState("boot");setTimeout(()=>{setState("idle");hist.forEach(m=>add(m.role==="user"?"u":"a",m.content));if(!hist.length)add("a","Хуш омадед, Ҷаноб. Ҳамаи низомҳо омодаанд.",1)},1700);

async function send(t){
  t=t.trim();if(!t)return;add("u",t);hist.push({role:"user",content:t});setState("think");
  try{
    const r=await fetch(API_BASE+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist.slice(-12)})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
    hist.push({role:"assistant",content:j.reply});save();add("a",j.reply,1);say(j.reply);
  }catch(e){add("a","Хато: "+e.message+". Сервер шояд ҳоло бедор шавад, пас аз як дақиқа боз кӯшиш кун.");setState("idle")}
}
function say(t){
  if(!$("vo").checked){setState("idle");return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=$("lang").value;
  u.onend=()=>setState("idle");setState("speak");speechSynthesis.speak(u);
}
$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value;$("in").value="";send(v)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$("mic").onclick=()=>{
  if(!SR)return add("a","Браузери ту шунидани овозро дастгирӣ намекунад. Chrome-ро кӯшиш кун.");
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=$("lang").value;rec.onstart=()=>{$("mic").classList.add("on");setState("listen")};
  rec.onresult=e=>send(e.results[0][0].transcript);
  rec.onend=()=>{$("mic").classList.remove("on");rec=null;if(state==="listen")setState("idle")};
  rec.onerror=()=>{};rec.start();
};

// HUD
const c=$("core"),x=c.getContext("2d"),calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let t=0,boot=calm?1:0,lvl=0;
function draw(){
  const S=520,m=S/2;x.clearRect(0,0,S,S);x.lineCap="round";x.setLineDash([]);
  boot=Math.min(1,boot+.011);const e=1-Math.pow(1-boot,3);
  t+=({boot:.9,idle:.4,listen:1.1,think:2.6,speak:1.6}[state])*(calm?.15:1)*.01;
  lvl+=({boot:.3,idle:.1,listen:.55,think:.22,speak:.85}[state]-lvl)*.06;
  const col=state==="think"||state==="boot"?"240,184,74":"79,216,255",C=a=>`rgba(${col},${a*e})`;
  for(let i=0;i<72;i++){const a=i/72*6.283+t*.15,L=i%6?7:16,r=m*.94*e;
    x.strokeStyle=C(i%6?.35:.85);x.lineWidth=i%6?1.5:2.5;x.beginPath();
    x.moveTo(m+Math.cos(a)*r,m+Math.sin(a)*r);x.lineTo(m+Math.cos(a)*(r-L),m+Math.sin(a)*(r-L));x.stroke()}
  for(let i=0;i<64;i++){const a=i/64*6.283-t*.4,h=4+lvl*30*Math.abs(Math.sin(t*8+i*.7)*Math.cos(i*.31+t*2)),r0=m*.74*e;
    x.strokeStyle=C(.7);x.lineWidth=3;x.beginPath();
    x.moveTo(m+Math.cos(a)*r0,m+Math.sin(a)*r0);x.lineTo(m+Math.cos(a)*(r0+h),m+Math.sin(a)*(r0+h));x.stroke()}
  [[.62,3.5,[150,40,30,40],1],[.52,2,[3,12],-1],[.4,7,[90,60],1.6]].forEach(([r,w,d,s])=>{
    x.setLineDash(d);x.lineDashOffset=-t*s*70;x.strokeStyle=C(.9);x.lineWidth=w;x.beginPath();x.arc(m,m,m*r*e,0,7);x.stroke()});
  x.setLineDash([]);x.strokeStyle=`rgba(240,184,74,${.9*e})`;x.lineWidth=4;x.beginPath();x.arc(m,m,m*.84*e,t*1.3,t*1.3+1.1);x.stroke();
  const cr=m*.2*e,cc=6.283*cr;x.setLineDash([Math.max(1,cc/3-18),18]);x.lineDashOffset=-t*30;
  x.strokeStyle=`rgba(191,243,255,${e})`;x.lineWidth=14;x.beginPath();x.arc(m,m,cr,0,7);x.stroke();x.setLineDash([]);
  const g=x.createRadialGradient(m,m,0,m,m,m*.24);g.addColorStop(0,`rgba(255,255,255,${e})`);g.addColorStop(.4,C(.9));g.addColorStop(1,C(0));
  x.fillStyle=g;x.beginPath();x.arc(m,m,m*.24*e*(1+Math.sin(t*3)*.06),0,7);x.fill();
  requestAnimationFrame(draw);
}
draw();

// PWA ва огоҳинома
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const b64=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
$("bell").onclick=async()=>{
  try{
    const reg=await navigator.serviceWorker.ready;
    if(await Notification.requestPermission()!=="granted")return add("a","Иҷозати огоҳинома дода нашуд.");
    const k=(await (await fetch(API_BASE+"/api/vapid")).json()).key;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k)});
    await fetch(API_BASE+"/api/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)});
    add("a","Огоҳинома фаъол шуд, Ҷаноб.");
  }catch(e){add("a","Огоҳинома фаъол нашуд: "+e.message)}
};
</script></body></html>
